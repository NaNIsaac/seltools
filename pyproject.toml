[project]
name = "seltools"
version = "0.1.0"
description = "Callable selectors for indexing data"
readme = "README.md"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["more-itertools", "numpy", "pytest"]
rust = ["seltools-rs"]

[tool.uv.sources]
seltools-rs = { path = "rust" }

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "test_seltools.py"]
