name: seltools

on:
  push:
    branches: [main]
    paths-ignore: ["README*.md", "CHANGELOG.md", "LICENSE"]
  pull_request:
    paths-ignore: ["README*.md", "CHANGELOG.md", "LICENSE"]
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request replaces the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Private minutes are limited and a macOS minute counts ten. Every OS and architecture
  # run for a release (tag) or by hand; everything else gets the Linux check only.
  plan:
    runs-on: ubuntu-latest
    outputs:
      test-os: ${{ steps.p.outputs.test-os }}
      build-rust: ${{ steps.p.outputs.build-rust }}
    steps:
      - id: p
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'test-os=["ubuntu-latest","ubuntu-24.04-arm","macos-15-intel","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'build-rust={"include":[{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64"},{"name":"linux-aarch64","os":"ubuntu-latest","target":"aarch64"},{"name":"macos-x86_64","os":"macos-15-intel","target":"x86_64"},{"name":"macos-arm64","os":"macos-latest","target":"aarch64"},{"name":"windows-x86_64","os":"windows-latest","target":"x64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'test-os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'build-rust={"include":[{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64"}]}' >> "$GITHUB_OUTPUT"
          fi

  build-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pure
          path: dist

  build-rust:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-rust) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # manylinux containers bring their own Pythons; elsewhere pass exact paths,
      # since "3.14" alone can resolve to the free-threaded build
      - uses: actions/setup-python@v7
        id: gil
        if: runner.os != 'Linux'
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v7
        id: ft
        if: runner.os != 'Linux'
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --out ../dist --interpreter
            ${{ runner.os == 'Linux' && '3.14 3.14t' || format('{0} {1}', steps.gil.outputs.python-path, steps.ft.outputs.python-path) }}
      - name: Check both ABIs were built
        shell: bash
        run: ls dist/*-cp314-cp314-*.whl dist/*-cp314-cp314t-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist-rs-${{ matrix.name }}
          path: dist

  sdist-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-rs-sdist
          path: dist

  test:
    needs: [plan, build-pure, build-rust]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.test-os) }}
        python: ["3.14+gil", "3.14t"]  # bare 3.14 may resolve to a free-threaded build
        mode: [pure, rust]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag
      # run outside the checkout so the installed wheel is tested, not src
      - name: Install into a clean venv
        working-directory: ${{ runner.temp }}
        run: |
          cp -r "$GITHUB_WORKSPACE/test_seltools.py" "$GITHUB_WORKSPACE/tests" .
          py='${{ matrix.python }}'
          uv python install "${py%+gil}"  # uv does not download for a +gil request
          uv venv --python "$py"
          uv pip install pytest numpy more-itertools
          spec=seltools; [ "${{ matrix.mode }}" = rust ] && spec='seltools[rust]'
          uv pip install --no-index --find-links "$GITHUB_WORKSPACE/dist" "$spec"
      - name: Test
        working-directory: ${{ runner.temp }}
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          "$py" -c "
          import importlib.util, sys, sysconfig, seltools
          assert bool(sysconfig.get_config_var('Py_GIL_DISABLED')) == '${{ matrix.python }}'.endswith('t')
          rust = importlib.util.find_spec('_seltools') is not None
          assert rust == ('${{ matrix.mode }}' == 'rust'), rust
          if rust:
              import _seltools
              assert seltools.circular_pairwise is _seltools.circular_pairwise
          print(sys.version)
          "
          "$py" -m pytest --doctest-modules --pyargs seltools test_seltools.py tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag
      - run: uv sync --locked --group docs
      - run: uv run sphinx-build -W -b doctest docs docs/_build/doctest
      - run: uv run sphinx-build -W -b html docs docs/_build/html
