<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 348" width="1020" height="348" role="img" aria-label="Circular selections: the missing closing edge"><title>Circular selections: the missing closing edge</title><rect x="0" y="0" width="1020" height="348" rx="22" fill="#10192a"/><text x="34" y="46" font-family="Arial,sans-serif" font-size="27" fill="#f1f6ff" font-weight="bold">Circular selections: the missing closing edge</text><text x="34" y="75" font-family="Arial,sans-serif" font-size="15" fill="#adc0d3">len(data) and data[i] are enough; no iterator buffering required.</text><rect x="27" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="41" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="55" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">1</text><text x="78" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Indexable input</text><text x="41" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">A   B   C   D</text><text x="41" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">indices 0, 1, 2, 3</text><text x="41" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">sequence length = 4</text><path d="M 253 194 h16 m-7 -6 7 6 -7 6" fill="none" stroke="#73e3c1" stroke-width="2" stroke-linecap="round"/><rect x="275" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="289" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="303" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">2</text><text x="326" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Wrap an index</text><text x="289" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">circular_getitem</text><text x="289" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">index 4 → A, 5 → B</text><text x="289" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">i % len(data)</text><path d="M 501 194 h16 m-7 -6 7 6 -7 6" fill="none" stroke="#73e3c1" stroke-width="2" stroke-linecap="round"/><rect x="523" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="537" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="551" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">3</text><text x="574" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Close the pairs</text><text x="537" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">AB · BC · CD · DA</text><text x="537" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">last element → first</text><text x="537" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">circular_pairwise</text><path d="M 749 194 h16 m-7 -6 7 6 -7 6" fill="none" stroke="#73e3c1" stroke-width="2" stroke-linecap="round"/><rect x="771" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="785" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="799" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">4</text><text x="822" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Wrap windows</text><text x="785" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">ABC · BCD</text><text x="785" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">CDA · DAB</text><text x="785" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">circular_windowed(3)</text><path d="M 34 302 H 986" stroke="#3c526b"/><text x="34" y="327" font-family="Arial,sans-serif" font-size="13.5" fill="#f6b977">Return values remain the original elements and tuples; the diagram abbreviates them.</text></svg>
