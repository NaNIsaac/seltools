[project]
name = "seltools-rs"
version = "0.1.0"
description = "Optional Rust iterators for seltools"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.14"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "_seltools"
features = ["pyo3/extension-module"]

[tool.uv]
# rebuild when the Rust source or the stub changes, not only pyproject.toml
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "_seltools.pyi" }]
